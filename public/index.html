<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Three-Tier Contact Manager</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="logo">☁️</div>

        <h1>AWS Three-Tier Contact Manager</h1>

        <p class="subtitle">
            EC2 • Node.js • Express • Amazon RDS
        </p>

        <form id="contactForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <textarea
                id="message"
                placeholder="Write your message..."
                required
            ></textarea>

            <button type="submit">
                Send Message 🚀
            </button>

        </form>

        <p id="result"></p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
